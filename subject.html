<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المادة</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2 class="header" id="title"></h2>
<div id="list"></div>

<script type="module">
import { db } from "./firebase.js";
import { collection, onSnapshot, query, orderBy }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const subject = location.search.replace("?","");

document.getElementById("title").innerText = subject;

const q = query(collection(db,subject),orderBy("time","desc"));

onSnapshot(q,snap=>{
let list=document.getElementById("list");
list.innerHTML="";

snap.forEach(d=>{
let data=d.data();

let content="";
if(data.type==="pdf") content=`<a href="${data.url}" target="_blank">PDF</a>`;
if(data.type==="image") content=`<img src="${data.url}">`;
if(data.type==="audio") content=`<audio controls src="${data.url}"></audio>`;

list.innerHTML+=`
<div class="card">
<h3>${data.title}</h3>
${content}
</div>`;
});
});
</script>

</body>
</html>
