<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>المادة</title>

<style>
body{
margin:0;
font-family:Cairo;
background:#0b1220;
color:white;
}

.header{
padding:20px;
text-align:center;
font-size:24px;
background:#111a2e;
}

.container{
padding:10px;
}

.box{
background:#16223a;
margin:10px;
padding:15px;
border-radius:12px;
}

img{max-width:100%;border-radius:10px}
a{color:#4da3ff}
</style>
</head>

<body>

<div class="header" id="title">المادة</div>

<div class="container" id="list"></div>

<script type="module">
import { db } from "./firebase.js";
import {
collection, onSnapshot, doc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const subject = new URLSearchParams(location.search).get("id");

/* اسم المادة */
const docSnap = await getDoc(doc(db,"subjects",subject));
document.getElementById("title").innerText = docSnap.data().name;

/* عرض المحتوى */
onSnapshot(collection(db,"subjects",subject,"items"), snap=>{
const box=document.getElementById("list");
box.innerHTML="";

snap.forEach(d=>{
let data=d.data();

let view="";

if(data.type==="text"){
view = `<p>${data.content}</p>`;
}
else if(data.type==="image"){
view = `<img src="${data.content}">`;
}
else if(data.type==="audio"){
view = `<audio controls src="${data.content}"></audio>`;
}
else if(data.type==="pdf"){
view = `<a href="${data.content}" target="_blank">فتح الكتاب</a>`;
}

box.innerHTML += `
<div class="box">
<h3>${data.title}</h3>
${view}
</div>
`;
});
});
</script>

</body>
</html>
