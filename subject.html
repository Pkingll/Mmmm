<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المادة</title>

<style>
body{
margin:0;
font-family:Cairo;
color:white;

/* 🖼️ الخلفية */
background-image:url("https://a.top4top.io/p_38068co2c0.jpg");
background-size:cover;
background-position:center;
background-attachment:fixed;
}

/* طبقة شفافة */
.overlay{
min-height:100vh;
background:rgba(0,0,0,0.75);
padding-bottom:20px;
}

/* 🔁 الشريط المتحرك */
.marquee{
background:rgba(0,0,0,0.7);
padding:10px;
overflow:hidden;
white-space:nowrap;
border-bottom:1px solid rgba(255,255,255,0.2);
}

.marquee span{
display:inline-block;
padding-left:100%;
animation:move 18s linear infinite;
font-size:16px;
}

@keyframes move{
0%{transform:translateX(0)}
100%{transform:translateX(-100%)}
}

/* 📚 اسم المادة */
.header{
text-align:center;
padding:18px;
font-size:22px;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(5px);
}

/* 📌 صندوق الفوائد */
.benefits{
background:rgba(0,0,0,0.75);
margin:10px;
padding:12px;
border-radius:12px;
backdrop-filter:blur(6px);
border:1px solid rgba(255,255,255,0.1);
}

.benefits h3{
margin:0 0 8px 0;
font-size:16px;
color:#4da3ff;
}

.benefits p{
margin:5px 0;
font-size:14px;
}

/* 🧾 المحتوى */
.container{
padding:10px;
}

.card{
background:rgba(0,0,0,0.6);
margin:10px 0;
padding:15px;
border-radius:12px;
backdrop-filter:blur(6px);
}

/* صور */
img{
max-width:100%;
border-radius:10px;
margin-top:10px;
}

/* روابط */
a{
color:#4da3ff;
text-decoration:none;
}

/* صوت */
audio{
width:100%;
margin-top:10px;
}

/* 📱 تحسين الهاتف */
@media (max-width:600px){
.header{
font-size:18px;
}
.card{
padding:12px;
}
}
</style>
</head>

<body>

<div class="overlay">

<!-- 🔁 الشريط المتحرك -->
<div class="marquee">
<span>من يرد الله به خيراً يفقهه في الدين</span>
</div>

<!-- 📚 اسم المادة -->
<div class="header" id="title">المادة</div>

<!-- 📌 صندوق الفوائد -->
<div class="benefits">
<h3>فوائد المادة</h3>
<div id="benefitsList"></div>
</div>

<!-- 🧾 المحتوى -->
<div class="container" id="list"></div>

</div>

<script type="module">
import { db } from "./firebase.js";
import {
collection, onSnapshot, doc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const subject = new URLSearchParams(location.search).get("id");

/* اسم المادة */
const subjectDoc = await getDoc(doc(db,"subjects",subject));
document.getElementById("title").innerText = subjectDoc.data().name;

/* 📌 الفوائد (Realtime) */
onSnapshot(collection(db,"subjects",subject,"benefits"), snap=>{
const box=document.getElementById("benefitsList");
box.innerHTML="";

snap.forEach(d=>{
box.innerHTML += `
<p>• ${d.data().text}</p>
`;
});
});

/* 🧾 المحتوى */
onSnapshot(collection(db,"subjects",subject,"items"), snap=>{
const box=document.getElementById("list");
box.innerHTML="";

snap.forEach(d=>{
let data=d.data();

let view="";

if(data.type==="text"){
view = `<p>${data.content}</p>`;
}
else if(data.type==="image"){
view = `<img src="${data.content}">`;
}
else if(data.type==="audio"){
view = `<audio controls src="${data.content}"></audio>`;
}
else if(data.type==="pdf"){
view = `<a href="${data.content}" target="_blank">فتح الكتاب</a>`;
}

box.innerHTML += `
<div class="card">
<h3>${data.title}</h3>
${view}
</div>
`;
});
});
</script>

</body>
</html>
