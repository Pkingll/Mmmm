<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المادة</title>

<style>
body{
margin:0;
font-family:Cairo;
color:white;
background:url("https://a.top4top.io/p_38068co2c0.jpg") center/cover fixed;
}

.overlay{
min-height:100vh;
background:rgba(0,0,0,0.75);
padding-bottom:20px;
}

.marquee{
background:rgba(0,0,0,0.7);
padding:10px;
white-space:nowrap;
overflow:hidden;
}

.marquee span{
display:inline-block;
padding-left:100%;
animation:move 18s linear infinite;
}

@keyframes move{
0%{transform:translateX(0)}
100%{transform:translateX(-100%)}
}

.header{
text-align:center;
padding:18px;
font-size:22px;
background:rgba(0,0,0,0.6);
}

.benefits{
background:rgba(0,0,0,0.75);
margin:10px;
padding:12px;
border-radius:12px;
}

.container{
padding:10px;
}

.card{
background:rgba(0,0,0,0.6);
margin:10px 0;
padding:15px;
border-radius:12px;
}

img{max-width:100%;border-radius:10px;margin-top:10px}
audio{width:100%}
a{color:#4da3ff}
</style>
</head>

<body>

<div class="overlay">

<div class="marquee">
<span>من يرد الله به خيراً يفقهه في الدين</span>
</div>

<div class="header" id="title"></div>

<div class="benefits">
<h3>فوائد المادة</h3>
<div id="benefitsList"></div>
</div>

<div class="container" id="list"></div>

</div>

<script type="module">
import { db } from "./firebase.js";
import {
collection, onSnapshot, doc, getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const id = new URLSearchParams(location.search).get("id");

/* اسم المادة */
const subjectDoc = await getDoc(doc(db,"subjects",id));
if(subjectDoc.exists()){
document.getElementById("title").innerText = subjectDoc.data().name;
}

/* فوائد */
onSnapshot(collection(db,"subjects",id,"benefits"),snap=>{
benefitsList.innerHTML="";
snap.forEach(d=>{
benefitsList.innerHTML += `<p>• ${d.data().text}</p>`;
});
});

/* دروس */
onSnapshot(collection(db,"subjects",id,"items"),snap=>{
list.innerHTML="";

snap.forEach(d=>{
let data = d.data();

let view="";

switch(data.type){
case "text":
view = `<p>${data.content}</p>`;
break;

case "image":
view = `<img src="${data.content}">`;
break;

case "audio":
view = `<audio controls src="${data.content}"></audio>`;
break;

case "pdf":
view = `<a href="${data.content}" target="_blank">📘 فتح الملف</a>`;
break;
}

list.innerHTML += `
<div class="card">
<h3>${data.title}</h3>
${view}
</div>`;
});
});
</script>

</body>
</html>
