<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>

<style>
body{
margin:0;
font-family:Cairo;
color:white;
background:url("https://a.top4top.io/p_38068co2c0.jpg") center/cover fixed;
}

.overlay{
background:rgba(0,0,0,0.75);
min-height:100vh;
padding:10px;
}

.subjects{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
}

.subject{
padding:12px 16px;
background:rgba(0,0,0,0.6);
border-radius:12px;
cursor:pointer;
transition:.2s;
}

.subject:hover{
transform:scale(1.05);
background:rgba(255,255,255,0.15);
}

.card{
background:rgba(0,0,0,0.5);
padding:10px;
margin:10px 0;
border-radius:10px;
}

input,select{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:8px;
}

button{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:8px;
background:#4da3ff;
color:white;
font-weight:bold;
}

.item{
display:flex;
justify-content:space-between;
background:rgba(0,0,0,0.4);
padding:8px;
margin:5px 0;
border-radius:8px;
}
</style>
</head>

<body>

<div class="overlay">

<h2>لوحة التحكم</h2>

<!-- 📚 المواد -->
<div class="subjects" id="subjects"></div>

<!-- 🟡 المادة المختارة -->
<h3 id="current">لم يتم اختيار مادة</h3>

<!-- ➕ إضافة -->
<div class="card">

<input id="title" placeholder="عنوان الدرس">

<select id="type">
<option value="text">نص</option>
<option value="image">صورة</option>
<option value="audio">صوت</option>
<option value="pdf">PDF</option>
</select>

<input id="content" placeholder="رابط أو نص">

<button onclick="addItem()">إضافة درس</button>

<hr>

<input id="benefit" placeholder="فائدة">
<button onclick="addBenefit()">إضافة فائدة</button>

</div>

<!-- 📋 عرض -->
<div class="card">
<h3>الدروس</h3>
<div id="items"></div>
</div>

<div class="card">
<h3>الفوائد</h3>
<div id="benefits"></div>
</div>

</div>

<script type="module">
import { db } from "./firebase.js";
import {
collection, addDoc, onSnapshot,
deleteDoc, doc
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

let subjectId=null;

/* 📚 تحميل المواد من Firebase */
onSnapshot(collection(db,"subjects"),snap=>{
subjects.innerHTML="";

snap.forEach(d=>{
const data = d.data();

subjects.innerHTML += `
<div class="subject" onclick="selectSubject('${d.id}','${data.name}')">
${data.name}
</div>`;
});
});

/* 📌 اختيار مادة */
window.selectSubject=(id,name)=>{
subjectId=id;
current.innerText="المادة المختارة: "+name;
load();
}

/* ➕ إضافة درس */
window.addItem=async()=>{
if(!subjectId){
alert("اختر مادة أولاً");
return;
}

await addDoc(collection(db,"subjects",subjectId,"items"),{
title:title.value,
type:type.value,
content:content.value
});
}

/* ➕ إضافة فائدة */
window.addBenefit=async()=>{
if(!subjectId){
alert("اختر مادة أولاً");
return;
}

await addDoc(collection(db,"subjects",subjectId,"benefits"),{
text:benefit.value
});
}

/* 📥 تحميل */
function load(){

onSnapshot(collection(db,"subjects",subjectId,"items"),snap=>{
items.innerHTML="";
snap.forEach(d=>{
items.innerHTML += `
<div class="item">
${d.data().title}
<button onclick="delItem('${d.id}')">حذف</button>
</div>`;
});
});

onSnapshot(collection(db,"subjects",subjectId,"benefits"),snap=>{
benefits.innerHTML="";
snap.forEach(d=>{
benefits.innerHTML += `
<div class="item">
${d.data().text}
<button onclick="delBenefit('${d.id}')">حذف</button>
</div>`;
});
});
}

/* حذف */
window.delItem=(id)=>{
deleteDoc(doc(db,"subjects",subjectId,"items",id));
}

window.delBenefit=(id)=>{
deleteDoc(doc(db,"subjects",subjectId,"benefits",id));
}
</script>

</body>
</html>
