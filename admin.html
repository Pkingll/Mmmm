<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title><style>
body{
margin:0;
padding:20px;
font-family:Cairo,sans-serif;
background:#06131f;
color:#fff;
}

h2{
text-align:center;
color:#d4af37;
}

.box{
max-width:700px;
margin:auto;
background:rgba(255,255,255,.08);
padding:20px;
border-radius:15px;
}

input,select,button{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
box-sizing:border-box;
}

button{
background:#d4af37;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

hr{
margin:25px 0;
}
</style><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import { getStorage, ref, uploadBytes, getDownloadURL }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "ضعي بياناتك هنا",
  authDomain: "ضعي بياناتك هنا",
  projectId: "ضعي بياناتك هنا",
  storageBucket: "ضعي بياناتك هنا",
  messagingSenderId: "ضعي بياناتك هنا",
  appId: "ضعي بياناتك هنا"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

window.uploadFile = async function(){

try{

const subject = document.getElementById("subject").value;
const type = document.getElementById("type").value;
const title = document.getElementById("title").value;
const file = document.getElementById("file").files[0];

if(!title){
alert("أدخلي عنوان الملف");
return;
}

if(!file){
alert("اختاري ملفاً");
return;
}

const fileRef = ref(storage, subject + "/" + Date.now() + "_" + file.name);

await uploadBytes(fileRef,file);

const url = await getDownloadURL(fileRef);

await addDoc(collection(db,subject),{
title,
type,
url,
time:Date.now()
});

alert("تم رفع الملف بنجاح");

}catch(err){
console.error(err);
alert("حدث خطأ أثناء الرفع");
}

}

window.addFawaid = async function(){

try{

const text = document.getElementById("fawaid").value;

if(!text){
alert("اكتبي فائدة");
return;
}

await addDoc(collection(db,"fawaid"),{
text,
time:Date.now()
});

alert("تمت إضافة الفائدة");

}catch(err){
console.error(err);
alert("حدث خطأ");
}

}
</script></head><body><div class="box"><h2>لوحة تحكم الأدمن</h2><select id="subject">
<option value="aqida">العقيدة</option>
<option value="hadith">الحديث</option>
<option value="fiqh">الفقه</option>
<option value="usul">أصول الفقه</option>
<option value="history">تاريخ الخلفاء الراشدين</option>
<option value="dawah">منهج الدعوة</option>
<option value="tajweed">أحكام وتجويد القرآن</option>
<option value="literature">الدراسات الأدبية</option>
<option value="nahw">النحو والصرف</option>
<option value="computer">الحاسوب</option>
<option value="english">الإنجليزي</option>
<option value="tafsir">التفسير</option>
</select><select id="type">
<option value="pdf">PDF</option>
<option value="audio">صوتية</option>
<option value="image">صورة</option>
</select><input id="title" placeholder="عنوان الملف">
<input type="file" id="file"><button onclick="uploadFile()">رفع الملف</button>

<hr><input id="fawaid" placeholder="إضافة فائدة فقهية">
<button onclick="addFawaid()">إضافة الفائدة</button></div></body>
</html>
