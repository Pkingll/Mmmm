<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>

<style>
body{
margin:0;
font-family:Cairo;
color:white;
background:url("https://a.top4top.io/p_38068co2c0.jpg") center/cover fixed;
}

.overlay{
background:rgba(0,0,0,0.75);
min-height:100vh;
padding:10px;
}

.subjects{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.subject{
padding:12px;
background:rgba(0,0,0,0.5);
border-radius:10px;
cursor:pointer;
}

.card{
background:rgba(0,0,0,0.5);
padding:10px;
margin:10px 0;
border-radius:10px;
}

input,select{
width:100%;
padding:10px;
margin:5px 0;
border-radius:8px;
border:none;
}

button{
width:100%;
padding:10px;
margin:5px 0;
background:#4da3ff;
color:white;
border:none;
border-radius:8px;
}

.item{
display:flex;
justify-content:space-between;
background:rgba(0,0,0,0.4);
padding:8px;
margin:5px 0;
border-radius:8px;
}
</style>
</head>

<body>

<div class="overlay">

<h2>لوحة التحكم</h2>

<div class="subjects" id="subjects"></div>

<div class="card">
<h3 id="current">اختر مادة</h3>

<input id="title" placeholder="عنوان الدرس">

<select id="type">
<option value="text">نص</option>
<option value="image">صورة</option>
<option value="audio">صوت</option>
<option value="pdf">PDF</option>
</select>

<input id="content" placeholder="المحتوى">

<button onclick="addItem()">إضافة</button>
</div>

<div class="card">
<input id="benefit" placeholder="فائدة">
<button onclick="addBenefit()">إضافة فائدة</button>
</div>

<div class="card">
<h3>الدروس</h3>
<div id="items"></div>
</div>

<div class="card">
<h3>الفوائد</h3>
<div id="benefits"></div>
</div>

</div>

<script type="module">
import { db } from "./firebase.js";
import {
collection, addDoc, onSnapshot,
deleteDoc, doc, updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

let id=null;
let editId=null;

/* مواد */
onSnapshot(collection(db,"subjects"),snap=>{
subjects.innerHTML="";
snap.forEach(d=>{
subjects.innerHTML+=`
<div class="subject" onclick="select('${d.id}','${d.data().name}')">
${d.data().name}
</div>`;
});
});

/* اختيار */
window.select=(x,name)=>{
id=x;
current.innerText=name;
load();
}

/* إضافة أو تعديل */
window.addItem=async()=>{

if(editId){
await updateDoc(doc(db,"subjects",id,"items",editId),{
title:title.value,
type:type.value,
content:content.value
});
editId=null;
}else{
await addDoc(collection(db,"subjects",id,"items"),{
title:title.value,
type:type.value,
content:content.value
});
}
}

/* فوائد */
window.addBenefit=async()=>{
await addDoc(collection(db,"subjects",id,"benefits"),{
text:benefit.value
});
}

/* تحميل */
function load(){

onSnapshot(collection(db,"subjects",id,"items"),snap=>{
items.innerHTML="";
snap.forEach(d=>{
items.innerHTML+=`
<div class="item">
${d.data().title}
<div>
<button onclick="editItem('${d.id}','${d.data().title}','${d.data().type}','${d.data().content}')">تعديل</button>
<button onclick="delItem('${d.id}')">حذف</button>
</div>
</div>`;
});
});

onSnapshot(collection(db,"subjects",id,"benefits"),snap=>{
benefits.innerHTML="";
snap.forEach(d=>{
benefits.innerHTML+=`
<div class="item">
${d.data().text}
<button onclick="delBenefit('${d.id}')">حذف</button>
</div>`;
});
});
}

/* تعديل */
window.editItem=(id2,t,type,content)=>{
editId=id2;
title.value=t;
typeSelect(type);
content.value=content;
}

/* اختيار النوع */
function typeSelect(val){
document.getElementById("type").value=val;
}

/* حذف */
window.delItem=(x)=>{
deleteDoc(doc(db,"subjects",id,"items",x));
}

window.delBenefit=(x)=>{
deleteDoc(doc(db,"subjects",id,"benefits",x));
}
</script>

</body>
</html>
