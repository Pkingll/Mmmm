<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة التحكم</title>

<style>
body{
margin:0;
font-family:Cairo;
color:white;

/* 🖼️ الخلفية */
background-image:url("https://a.top4top.io/p_38068co2c0.jpg");
background-size:cover;
background-position:center;
background-attachment:fixed;
}

/* طبقة شفافة */
.overlay{
min-height:100vh;
background:rgba(0,0,0,0.7);
display:flex;
justify-content:center;
align-items:center;
}

/* صندوق الدخول */
.login-box{
background:rgba(0,0,0,0.7);
padding:20px;
border-radius:15px;
width:300px;
text-align:center;
backdrop-filter:blur(5px);
}

input,button,select{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:8px;
}

/* لوحة التحكم */
.panel{
display:none;
width:90%;
margin:auto;
padding:20px;
}

.card{
background:rgba(0,0,0,0.6);
padding:15px;
margin:10px 0;
border-radius:12px;
backdrop-filter:blur(5px);
}

button{
cursor:pointer;
background:#4da3ff;
color:white;
}
</style>
</head>

<body>

<!-- 🔐 تسجيل الدخول -->
<div class="overlay" id="loginScreen">
<div class="login-box">
<h3>لوحة التحكم</h3>
<input type="password" id="pass" placeholder="كلمة المرور">
<button onclick="login()">دخول</button>
</div>
</div>

<!-- ⚙️ لوحة التحكم -->
<div class="panel" id="panel">

<h2 style="text-align:center">⚙️ إدارة المحتوى</h2>

<div class="card">
<h3>➕ إضافة عنصر</h3>

<input id="title" placeholder="العنوان">

<select id="type">
<option value="text">نص</option>
<option value="image">صورة (رابط)</option>
<option value="audio">صوت (رابط)</option>
<option value="pdf">كتاب PDF (رابط)</option>
</select>

<input id="content" placeholder="المحتوى أو الرابط">

<button onclick="addItem()">إضافة</button>
</div>

<div id="list"></div>

</div>

<script type="module">
import { db } from "./firebase.js";
import {
collection, addDoc, onSnapshot,
deleteDoc, doc, updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const subject = new URLSearchParams(location.search).get("id");

/* 🔐 تسجيل دخول */
window.login = ()=>{
const pass = document.getElementById("pass").value;

if(pass === "1997"){
document.getElementById("loginScreen").style.display="none";
document.getElementById("panel").style.display="block";
load();
}
else{
alert("كلمة المرور غير صحيحة");
}
}

/* ➕ إضافة */
window.addItem = async ()=>{
await addDoc(collection(db,"subjects",subject,"items"),{
title:document.getElementById("title").value,
type:document.getElementById("type").value,
content:document.getElementById("content").value,
time:Date.now()
});

document.getElementById("title").value="";
document.getElementById("content").value="";
}

/* 📋 عرض */
function load(){
const box=document.getElementById("list");

onSnapshot(collection(db,"subjects",subject,"items"), snap=>{
box.innerHTML="";

snap.forEach(d=>{
let data=d.data();

box.innerHTML += `
<div class="card">
<h3>${data.title}</h3>
<small>${data.type}</small>
<br><br>

<button onclick="edit('${d.id}','${data.title}','${data.content}')">تعديل</button>
<button onclick="del('${d.id}')">حذف</button>
</div>
`;
});
});
}

/* ✏️ تعديل */
window.edit = async (id,title,content)=>{
let t=prompt("العنوان",title);
let c=prompt("المحتوى",content);

await updateDoc(doc(db,"subjects",subject,"items",id),{
title:t,
content:c
});
}

/* 🗑 حذف */
window.del = async (id)=>{
await deleteDoc(doc(db,"subjects",subject,"items",id));
}
</script>

</body>
</html>
