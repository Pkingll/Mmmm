<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>

<style>
body{
margin:0;
font-family:Cairo;
color:white;

background-image:url("https://a.top4top.io/p_38068co2c0.jpg");
background-size:cover;
background-position:center;
background-attachment:fixed;
}

.overlay{
min-height:100vh;
background:rgba(0,0,0,0.75);
padding:10px;
}

.panel{
width:100%;
max-width:900px;
margin:auto;
}

.card{
background:rgba(0,0,0,0.6);
padding:15px;
margin:10px 0;
border-radius:12px;
backdrop-filter:blur(6px);
}

input,select,button{
width:100%;
padding:12px;
margin:6px 0;
border:none;
border-radius:10px;
font-size:15px;
}

button{
background:#4da3ff;
color:white;
cursor:pointer;
font-weight:bold;
}

.row{
background:rgba(0,0,0,0.5);
padding:10px;
margin:10px 0;
border-radius:10px;
}

h2,h3{text-align:center}

@media(max-width:600px){
.card{padding:12px}
}
</style>
</head>

<body>

<div class="overlay">

<div class="panel">

<h2>لوحة التحكم</h2>

<!-- 📂 اختيار المادة -->
<div class="card">
<h3>اختيار المادة</h3>
<input id="subjectId" placeholder="مثال: aqida">
<button onclick="loadSubject()">فتح المادة</button>
</div>

<!-- ➕ إضافة محتوى -->
<div class="card">
<h3>إضافة محتوى</h3>

<input id="title" placeholder="العنوان">

<select id="type">
<option value="text">نص</option>
<option value="image">صورة (رابط)</option>
<option value="audio">صوت (رابط)</option>
<option value="pdf">كتاب PDF (رابط)</option>
</select>

<input id="content" placeholder="النص أو الرابط">

<button onclick="addItem()">إضافة</button>
</div>

<!-- ➕ إضافة فائدة -->
<div class="card">
<h3>إضافة فائدة</h3>
<input id="benefitText" placeholder="اكتب الفائدة">
<button onclick="addBenefit()">إضافة</button>
</div>

<!-- 📋 المحتوى -->
<div class="card">
<h3>المحتوى</h3>
<div id="items"></div>
</div>

<!-- 📌 الفوائد -->
<div class="card">
<h3>فوائد المادة</h3>
<div id="benefits"></div>
</div>

</div>

</div>

<script type="module">
import { db } from "./firebase.js";
import {
collection, addDoc, onSnapshot,
deleteDoc, doc, updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

let subject = "";

/* 📂 فتح المادة */
window.loadSubject = ()=>{
subject = document.getElementById("subjectId").value;

/* 🧾 المحتوى */
onSnapshot(collection(db,"subjects",subject,"items"), snap=>{
const box=document.getElementById("items");
box.innerHTML="";

snap.forEach(d=>{
let data=d.data();

box.innerHTML += `
<div class="row">
<strong>${data.title}</strong>
<br>
<small>${data.type}</small>

<br><br>

<button onclick="editItem('${d.id}','${data.title}','${data.content}','${data.type}')">تعديل</button>
<button onclick="delItem('${d.id}')">حذف</button>
</div>
`;
});
});

/* 📌 الفوائد */
onSnapshot(collection(db,"subjects",subject,"benefits"), snap=>{
const box=document.getElementById("benefits");
box.innerHTML="";

snap.forEach(d=>{
let data=d.data();

box.innerHTML += `
<div class="row">
${data.text}

<br><br>

<button onclick="editBenefit('${d.id}','${data.text}')">تعديل</button>
<button onclick="delBenefit('${d.id}')">حذف</button>
</div>
`;
});
});
}

/* ➕ إضافة محتوى */
window.addItem = async ()=>{
await addDoc(collection(db,"subjects",subject,"items"),{
title:document.getElementById("title").value,
type:document.getElementById("type").value,
content:document.getElementById("content").value,
time:Date.now()
});

document.getElementById("title").value="";
document.getElementById("content").value="";
}

/* ➕ إضافة فائدة */
window.addBenefit = async ()=>{
await addDoc(collection(db,"subjects",subject,"benefits"),{
text:document.getElementById("benefitText").value,
time:Date.now()
});

document.getElementById("benefitText").value="";
}

/* ✏️ تعديل المحتوى */
window.editItem = async (id,title,content,type)=>{
let t = prompt("العنوان",title);
let c = prompt("المحتوى",content);

await updateDoc(doc(db,"subjects",subject,"items",id),{
title:t,
content:c,
type:type
});
}

/* ✏️ تعديل الفائدة */
window.editBenefit = async (id,text)=>{
let t = prompt("تعديل الفائدة",text);

await updateDoc(doc(db,"subjects",subject,"benefits",id),{
text:t
});
}

/* 🗑 حذف المحتوى */
window.delItem = async (id)=>{
await deleteDoc(doc(db,"subjects",subject,"items",id));
}

/* 🗑 حذف الفائدة */
window.delBenefit = async (id)=>{
await deleteDoc(doc(db,"subjects",subject,"benefits",id));
}
</script>

</body>
</html>
