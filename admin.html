<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>

<style>
body{
margin:0;
font-family:Cairo;
color:white;
background:url("https://a.top4top.io/p_38068co2c0.jpg") center/cover fixed;
}

body::before{
content:"";
position:fixed;
inset:0;
background:rgba(0,0,0,0.7);
z-index:-1;
}

.container{
max-width:900px;
margin:auto;
padding:10px;
}

.card{
background:rgba(0,0,0,0.5);
padding:12px;
margin:10px 0;
border-radius:12px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.btn{
background:#1a2a45;
padding:15px;
border-radius:12px;
text-align:center;
cursor:pointer;
}

input,select,button{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:8px;
}

button{
background:#4da3ff;
color:white;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h2>لوحة التحكم</h2>

<div class="card">
<h3>المواد</h3>
<div class="grid">
<div class="btn" onclick="select('aqida','العقيدة')">العقيدة</div>
<div class="btn" onclick="select('hadith','الحديث')">الحديث</div>
<div class="btn" onclick="select('fiqh','الفقه')">الفقه</div>
<div class="btn" onclick="select('tafsir','التفسير')">التفسير</div>
</div>
</div>

<div class="card">
<h3 id="current">اختر مادة</h3>

<input id="title" placeholder="عنوان">
<select id="type">
<option value="text">نص</option>
<option value="image">صورة</option>
<option value="audio">صوت</option>
<option value="pdf">PDF</option>
</select>

<input id="content" placeholder="رابط أو نص">

<button onclick="addItem()">إضافة درس</button>
</div>

<div class="card">
<input id="benefit" placeholder="فائدة">
<button onclick="addBenefit()">إضافة فائدة</button>
</div>

<div class="card">
<h3>الدروس</h3>
<div id="items"></div>
</div>

<div class="card">
<h3>الفوائد</h3>
<div id="benefits"></div>
</div>

</div>

<script type="module">
import { db } from "./firebase.js";
import { collection, addDoc, onSnapshot, deleteDoc, doc }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

let id=null;

window.select=(x,name)=>{
id=x;
current.innerText="المادة: "+name;
load();
}

window.addItem=async()=>{
if(!id)return alert("اختر مادة");
await addDoc(collection(db,"subjects",id,"items"),{
title:title.value,
type:type.value,
content:content.value
});
}

window.addBenefit=async()=>{
if(!id)return alert("اختر مادة");
await addDoc(collection(db,"subjects",id,"benefits"),{
text:benefit.value
});
}

function load(){

onSnapshot(collection(db,"subjects",id,"items"),snap=>{
items.innerHTML="";
snap.forEach(d=>{
items.innerHTML+=`
<div class="card">
${d.data().title}
<button onclick="delItem('${d.id}')">حذف</button>
</div>`;
});
});

onSnapshot(collection(db,"subjects",id,"benefits"),snap=>{
benefits.innerHTML="";
snap.forEach(d=>{
benefits.innerHTML+=`
<div class="card">
${d.data().text}
<button onclick="delBenefit('${d.id}')">حذف</button>
</div>`;
});
});
}

window.delItem=(x)=>{
deleteDoc(doc(db,"subjects",id,"items",x));
}

window.delBenefit=(x)=>{
deleteDoc(doc(db,"subjects",id,"benefits",x));
}
</script>

</body>
</html>
