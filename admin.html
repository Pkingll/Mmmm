<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>

<style>
body{
margin:0;
font-family:Cairo;
color:white;
background-image:url("https://a.top4top.io/p_38068co2c0.jpg");
background-size:cover;
background-position:center;
background-attachment:fixed;
}

.overlay{
min-height:100vh;
background:rgba(0,0,0,0.75);
padding:10px;
}

.panel{
max-width:900px;
margin:auto;
}

.card{
background:rgba(0,0,0,0.6);
padding:15px;
margin:10px 0;
border-radius:12px;
}

input,select,button{
width:100%;
padding:12px;
margin:6px 0;
border:none;
border-radius:10px;
}

button{
background:#4da3ff;
color:white;
font-weight:bold;
cursor:pointer;
}

.row{
background:rgba(0,0,0,0.5);
padding:10px;
margin:10px 0;
border-radius:10px;
}
</style>
</head>

<body>

<div class="overlay">

<div class="panel">

<h2 style="text-align:center">لوحة التحكم الذكية</h2>

<!-- ➕ إضافة مادة -->
<div class="card">
<h3>إضافة مادة</h3>
<input id="newSubject" placeholder="اسم المادة">
<button onclick="addSubject()">إضافة مادة</button>
</div>

<!-- 📚 اختيار مادة -->
<div class="card">
<h3>المواد</h3>
<div id="subjects"></div>
</div>

<!-- ➕ إضافة محتوى -->
<div class="card">
<h3>إضافة محتوى للمادة المختارة</h3>

<input id="title" placeholder="العنوان">

<select id="type">
<option value="text">نص</option>
<option value="image">صورة</option>
<option value="audio">صوت</option>
<option value="pdf">PDF</option>
</select>

<input id="content" placeholder="المحتوى أو الرابط">

<button onclick="addItem()">إضافة</button>
</div>

<!-- 📌 الفوائد -->
<div class="card">
<h3>فوائد المادة</h3>

<input id="benefit" placeholder="فائدة">
<button onclick="addBenefit()">إضافة</button>

<div id="benefits"></div>
</div>

<!-- 📋 المحتوى -->
<div class="card">
<h3>المحتوى</h3>
<div id="items"></div>
</div>

</div>

</div>

<script type="module">
import { db } from "./firebase.js";
import {
collection, addDoc, onSnapshot,
deleteDoc, doc, updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

let currentSubject = null;

/* ➕ إضافة مادة */
window.addSubject = async ()=>{
await addDoc(collection(db,"subjects"),{
name:document.getElementById("newSubject").value,
time:Date.now()
});
}

/* 📚 عرض المواد */
onSnapshot(collection(db,"subjects"), snap=>{
const box=document.getElementById("subjects");
box.innerHTML="";

snap.forEach(d=>{
box.innerHTML += `
<div class="row">
<strong>${d.data().name}</strong>
<br><br>

<button onclick="selectSubject('${d.id}','${d.data().name}')">
اختيار
</button>
</div>
`;
});
});

/* 📌 اختيار مادة */
window.selectSubject = (id,name)=>{
currentSubject = id;

loadData();
}

/* 🧾 تحميل المحتوى */
function loadData(){

/* items */
onSnapshot(collection(db,"subjects",currentSubject,"items"), snap=>{
const box=document.getElementById("items");
box.innerHTML="";

snap.forEach(d=>{
box.innerHTML += `
<div class="row">
${d.data().title}
<button onclick="delItem('${d.id}')">حذف</button>
</div>
`;
});
});

/* benefits */
onSnapshot(collection(db,"subjects",currentSubject,"benefits"), snap=>{
const box=document.getElementById("benefits");
box.innerHTML="";

snap.forEach(d=>{
box.innerHTML += `
<div class="row">
${d.data().text}
<button onclick="delBenefit('${d.id}')">حذف</button>
</div>
`;
});
});
}

/* ➕ إضافة محتوى */
window.addItem = async ()=>{
if(!currentSubject){
alert("اختر مادة أولاً");
return;
}

await addDoc(collection(db,"subjects",currentSubject,"items"),{
title:document.getElementById("title").value,
type:document.getElementById("type").value,
content:document.getElementById("content").value,
time:Date.now()
});
}

/* ➕ فائدة */
window.addBenefit = async ()=>{
if(!currentSubject){
alert("اختر مادة أولاً");
return;
}

await addDoc(collection(db,"subjects",currentSubject,"benefits"),{
text:document.getElementById("benefit").value,
time:Date.now()
});
}

/* 🗑 حذف */
window.delItem = async (id)=>{
await deleteDoc(doc(db,"subjects",currentSubject,"items",id));
}

window.delBenefit = async (id)=>{
await deleteDoc(doc(db,"subjects",currentSubject,"benefits",id));
}
</script>

</body>
</html>
